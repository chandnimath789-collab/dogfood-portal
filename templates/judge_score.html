<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Score Project - Dogfood Portal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        .project-info {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e5e7eb;
        }

        .criterion {
            padding: 20px;
            margin-bottom: 18px;
            background: #f9fafb;
            border-radius: 10px;
        }

        .criterion h3 {
            margin-top: 0;
        }

        .weight {
            color: #6b7280;
            font-size: 14px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 14px;
            margin-bottom: 7px;
        }

        input,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #4338ca;
        }

        .hint {
            color: #6b7280;
            font-size: 13px;
            margin-top: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Score Project</h1>

        <div class="project-info">

            <h2>{{ assignment[3] }}</h2>

            <p>
                <strong>Team:</strong> {{ assignment[5] }}
            </p>

            <p>
                {{ assignment[4] }}
            </p>

        </div>

        <form method="POST">

            {% for criterion in criteria %}

                <div class="criterion">

                    <h3>{{ criterion[1] }}</h3>

                    <div class="weight">
                        Weight: {{ (criterion[2] * 100)|round(0) }}%
                    </div>

                    <label for="score_{{ criterion[0] }}">
                        Score (0–5)
                    </label>

                    <input
                        type="number"
                        id="score_{{ criterion[0] }}"
                        name="score_{{ criterion[0] }}"
                        min="0"
                        max="5"
                        step="0.1"
                        value="{{ saved_scores.get(criterion[0], {}).get('score', '') }}"
                        required
                    >

                    <div class="hint">
                        Enter a score from 0 to 5.
                    </div>

                    <label for="comment_{{ criterion[0] }}">
                        Comment
                    </label>

                    <textarea
                        id="comment_{{ criterion[0] }}"
                        name="comment_{{ criterion[0] }}"
                        placeholder="Add feedback..."
                    >{{ saved_scores.get(criterion[0], {}).get('comment', '') }}</textarea>

                </div>

            {% endfor %}

            <button type="submit">
                Save Scores
            </button>

        </form>

    </div>

</div>

</body>
</html>
