<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Team - Dogfood Portal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 28px;
            margin-bottom: 20px;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        }

        h1, h2 {
            margin-top: 0;
        }

        .info {
            margin: 10px 0;
        }

        .label {
            font-weight: bold;
        }

        .invite-box {
            margin-top: 20px;
            padding: 15px;
            background: #f3f4f6;
            border-radius: 10px;
        }

        .invite-link {
            word-break: break-all;
            margin-top: 8px;
        }

        .member {
            padding: 15px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .member:last-child {
            border-bottom: none;
        }

        .member-name {
            font-weight: bold;
        }

        .member-email {
            color: #6b7280;
            font-size: 14px;
            margin-top: 4px;
        }

        .role {
            display: inline-block;
            margin-top: 6px;
            padding: 4px 9px;
            border-radius: 15px;
            background: #eef2ff;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>My Team</h1>

    <div class="card">

        <h2>{{ team[1] }}</h2>

        <p class="info">
            <span class="label">Event:</span>
            {{ team[3] }}
        </p>

        <div class="invite-box">
            <strong>Invite Link</strong>

            <div class="invite-link">
                http://127.0.0.1:5000/join-team/{{ team[2] }}
            </div>
        </div>

    </div>

    <div class="card">

        <h2>Team Members</h2>

        {% for member in members %}

            <div class="member">

                <div class="member-name">
                    {{ member[0] }}
                </div>

                <div class="member-email">
                    {{ member[1] }}
                </div>

                <div class="role">
                    {{ member[2] }}
                </div>

            </div>

        {% endfor %}

    </div>

</div>

</body>
</html>
