<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Team - Dogfood Portal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 650px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #6366f1;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        .empty {
            padding: 15px;
            background: #f3f4f6;
            border-radius: 8px;
            color: #6b7280;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Create Your Team</h1>

        <p class="subtitle">
            Select a hackathon event and create your team.
        </p>

        <form method="POST">

            <div class="form-group">

                <label for="name">Team Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="e.g. Tech Warriors"
                    required
                >

            </div>

            <div class="form-group">

                <label for="event_id">Hackathon Event</label>

                {% if events %}

                    <select id="event_id" name="event_id" required>

                        <option value="" disabled selected>
                            Select an event
                        </option>

                        {% for event in events %}

                            <option value="{{ event[0] }}">
                                {{ event[1] }}
                            </option>

                        {% endfor %}

                    </select>

                {% else %}

                    <div class="empty">
                        No open hackathon events available.
                    </div>

                {% endif %}

            </div>

            {% if events %}
                <button type="submit">
                    Create Team
                </button>
            {% endif %}

        </form>

    </div>

</div>

</body>
</html>
